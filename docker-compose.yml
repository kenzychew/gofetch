services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gofetch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gofetch

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://gofetch:${POSTGRES_PASSWORD}@postgres:5432/gofetch"
      GCP_PROJECT: "${GCP_PROJECT:-gofetch-493315}"
      GCP_REGION: "${GCP_REGION:-us-central1}"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/.config/gcloud/application_default_credentials.json"
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data
      - bm25_index:/app/bm25_index
      - graph_data:/app/graph_data
      - ${GOOGLE_ADC_PATH}:/app/.config/gcloud/application_default_credentials.json:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "ui/app.py"]
    ports:
      - "7860:7860"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  bm25_index:
  graph_data:
